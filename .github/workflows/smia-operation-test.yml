# SMIA operation smoke test: build both base images and check boot logs.
# Package source priority: if the pyproject.toml version is already on TestPyPI,
# the image is built from there; otherwise the wheel compiled in the runner is used.
name: SMIA Operation Smoke Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-conditions:
    name: Evaluate trigger (feat/fix msg or pyproject.toml changed)
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.evaluate.outputs.should_run }}
      version: ${{ steps.evaluate.outputs.version }}
      testpypi_hit: ${{ steps.evaluate.outputs.testpypi_hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check commit message and modified files
        id: evaluate
        run: |
          MSG="${{ github.event.head_commit.message }}"
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          echo "Head commit message: $MSG"
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$MSG" | grep -qE 'feat|fix' || echo "$CHANGED" | grep -qx 'pyproject.toml'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            SHOULD_RUN=true
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            SHOULD_RUN=false
            echo "Skipping: no feat/fix in commit message and pyproject.toml unchanged."
          fi
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "SMIA version: $VER"
          # Single-shot check (no polling): if the version is already indexed on
          # TestPyPI, the image is built from there; otherwise the local wheel is used.
          if [ "$SHOULD_RUN" = "true" ] && pip index versions --index-url https://test.pypi.org/simple/ smia 2>/dev/null | grep -qF "$VER"; then
            echo "testpypi_hit=true" >> "$GITHUB_OUTPUT"
            echo "smia==$VER found on TestPyPI: images will be built from TestPyPI."
          else
            echo "testpypi_hit=false" >> "$GITHUB_OUTPUT"
            echo "smia==$VER not on TestPyPI: images will be built from the local wheel."
          fi

  smoke-test:
    name: Smoke ${{ matrix.base }}
    needs: check-conditions
    if: needs.check-conditions.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        base: [alpine-base, full-base]
        include:
          - base: alpine-base
            dockerfile: docker/Dockerfile_SMIA_base_template
            tag: smia:test-alpine-base
          - base: full-base
            dockerfile: docker/Dockerfile_SMIA_full_base_template
            tag: smia:test-full-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel locally
        if: needs.check-conditions.outputs.testpypi_hit != 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir docker/dist
          ls -lh docker/dist/

      - name: Prepare empty dist dir (TestPyPI hit, no wheel needed)
        if: needs.check-conditions.outputs.testpypi_hit == 'true'
        run: mkdir -p docker/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (${{ matrix.base }})
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.tag }}" \
            --build-arg "SMIA_VERSION=${{ needs.check-conditions.outputs.version }}" \
            --build-arg "PREFER_TESTPYPI=${{ needs.check-conditions.outputs.testpypi_hit }}" \
            --build-arg PIP_INDEX_URL=https://test.pypi.org/simple/ \
            --build-arg PIP_EXTRA_INDEX_URL=https://pypi.org/simple \
            ./docker

      - name: Smoke test (${{ matrix.base }})
        run: |
          bash .github/smia_smoke_check.sh
        env:
          SMIA_IMAGE: ${{ matrix.tag }}
          SMOKE_TIMEOUT: 120
